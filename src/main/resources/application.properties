# Server Configuration
server.port=8082
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sla_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Phnom_Penh
spring.jpa.open-in-view=false

# JWT Security Configuration (HMAC-SHA256 256-bit secret)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity: 86400000 ms = 24 hours
jwt.expiration-ms=86400000

# CORS Configuration for React Frontend
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.ngrok-free.app,https://*.ngrok.io
